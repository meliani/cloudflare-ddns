---
# Namespace for the imsof Cloudflare DDNS deployment
apiVersion: v1
kind: Namespace
metadata:
	name: imsof-dns-services
	labels:
		app.kubernetes.io/name: imsof-dns-services
---
apiVersion: apps/v1
kind: Deployment
metadata:
	name: cloudflare-ddns-imsof
	namespace: imsof-dns-services
	labels:
		app: cloudflare-ddns-imsof
spec:
	selector:
		matchLabels:
			app: cloudflare-ddns-imsof
	template:
		metadata:
			labels:
				app: cloudflare-ddns-imsof
		spec:
			containers:
				- name: cloudflare-ddns
					image: timothyjmiller/cloudflare-ddns:latest
					imagePullPolicy: IfNotPresent
					resources:
						requests:
							cpu: "50m"
							memory: "32Mi"
						limits:
							cpu: "50m"
							memory: "32Mi"
					env:
						- name: CONFIG_PATH
							value: /etc/cloudflare-ddns/
					volumeMounts:
						- name: config-cloudflare-ddns-imsof
							mountPath: /etc/cloudflare-ddns
							readOnly: true
			volumes:
				- name: config-cloudflare-ddns-imsof
					secret:
						secretName: config-cloudflare-ddns-imsof


---
# Namespace for the imsof Cloudflare DDNS deployment
apiVersion: v1
kind: Namespace
metadata:
  name: imsof-dns-services
  labels:
    app.kubernetes.io/name: imsof-dns-services
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: imsof-cloudflare-dns
  namespace: imsof-dns-services
  labels:
    app.kubernetes.io/name: imsof-cloudflare-dns
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: imsof-cloudflare-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: imsof-cloudflare-dns
    spec:
      containers:
        - name: cloudflare-ddns
          image: timothyjmiller/cloudflare-ddns:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: CONFIG_PATH
              value: /etc/cloudflare-ddns/
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflare-ddns
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: config-cloudflare-ddns-imsof
